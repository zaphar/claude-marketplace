# JSON Schema for Requirements Specification (in YAML format)
# This schema validates the output of the Requirements Analyst personality
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Requirements Specification
type: object
required:
  - metadata
  - problem_statement
  - personas
  - requirements
  - constraints
  - assumptions
additionalProperties: false

properties:
  metadata:
    type: object
    required:
      - title
      - version
      - created
      - status
    properties:
      title:
        type: string
        description: Name of the project or feature
      version:
        type: string
        description: Version of this requirements document
      created:
        type: string
        format: date
      updated:
        type: string
        format: date
      status:
        type: string
        enum: [draft, review, approved]
      stakeholders:
        type: array
        items:
          type: string

  problem_statement:
    type: string
    description: Clear description of what problem this solves

  personas:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
          pattern: "^PERSONA-[0-9]{3}$"
        name:
          type: string
        description:
          type: string
        goals:
          type: array
          items:
            type: string

  requirements:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - description
        - priority
        - category
        - acceptance_criteria
      properties:
        id:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        description:
          type: string
        rationale:
          type: string
          description: Why this requirement exists
        priority:
          type: string
          enum: [must-have, should-have, nice-to-have]
        category:
          type: string
          enum:
            - functional
            - security
            - usability
            - performance
            - operational
            - deployment
        acceptance_criteria:
          type: array
          minItems: 1
          items:
            type: string
        personas:
          type: array
          items:
            type: string
            pattern: "^PERSONA-[0-9]{3}$"
          description: Which personas this requirement serves
        depends_on:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"
          description: Other requirements this depends on

  inputs:
    type: array
    items:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
        format:
          type: string

  outputs:
    type: array
    items:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
        destination:
          type: string
        format:
          type: string

  constraints:
    type: object
    properties:
      accessibility:
        type: array
        items:
          type: string
      regulatory:
        type: array
        items:
          type: string
      technology:
        type: object
        properties:
          allowed_languages:
            type: array
            items:
              type: string
          forbidden_dependencies:
            type: array
            items:
              type: string
          required_frameworks:
            type: array
            items:
              type: string

  assumptions:
    type: array
    items:
      type: string

  out_of_scope:
    type: array
    items:
      type: string

  deployment:
    type: object
    properties:
      target:
        type: string
        enum: [private-cloud, local-executable, both, other]
      infrastructure_requirements:
        type: array
        items:
          type: string
      notes:
        type: string

  operational:
    type: object
    properties:
      uptime_requirement:
        type: string
      monitoring:
        type: array
        items:
          type: string
      logging:
        type: array
        items:
          type: string
      observability:
        type: array
        items:
          type: string

  done_criteria:
    type: array
    minItems: 1
    items:
      type: string
    description: What must be true for this to be considered complete