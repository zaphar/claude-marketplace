# JSON Schema for Test Report (in YAML format)
# This schema validates the output of the QA Engineer personality
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Test Report
type: object
required:
  - metadata
  - summary
  - requirements_coverage
  - test_suites
additionalProperties: false

properties:
  metadata:
    type: object
    required:
      - version
      - created
      - requirements_version
      - architecture_version
    properties:
      version:
        type: string
      created:
        type: string
        format: date-time
      requirements_version:
        type: string
      architecture_version:
        type: string
      commit_sha:
        type: string

  summary:
    type: object
    required:
      - total_tests
      - passed
      - failed
      - skipped
      - coverage
      - status
    properties:
      total_tests:
        type: integer
        minimum: 0
      passed:
        type: integer
        minimum: 0
      failed:
        type: integer
        minimum: 0
      skipped:
        type: integer
        minimum: 0
      coverage:
        type: object
        required:
          - line
          - branch
        properties:
          line:
            type: number
            minimum: 0
            maximum: 100
          branch:
            type: number
            minimum: 0
            maximum: 100
          function:
            type: number
            minimum: 0
            maximum: 100
      duration_seconds:
        type: number
      status:
        type: string
        enum: [pass, fail, blocked]

  requirements_coverage:
    type: array
    items:
      type: object
      required:
        - requirement_id
        - acceptance_criteria_results
        - status
      properties:
        requirement_id:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        acceptance_criteria_results:
          type: array
          items:
            type: object
            required:
              - criterion
              - status
            properties:
              criterion:
                type: string
              status:
                type: string
                enum: [pass, fail, not_tested]
              test_ids:
                type: array
                items:
                  type: string
              notes:
                type: string
        status:
          type: string
          enum: [pass, fail, partial, not_tested]

  test_suites:
    type: array
    items:
      type: object
      required:
        - name
        - type
        - tests
      properties:
        name:
          type: string
        type:
          type: string
          enum: [unit, integration, e2e, security, performance]
        tests:
          type: array
          items:
            type: object
            required:
              - id
              - name
              - status
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              status:
                type: string
                enum: [pass, fail, skipped, flaky]
              duration_ms:
                type: number
              requirements_tested:
                type: array
                items:
                  type: string
                  pattern: "^REQ-[0-9]{3}$"
              error_message:
                type: string
              stack_trace:
                type: string
              retry_count:
                type: integer

  security_tests:
    type: object
    properties:
      vulnerability_scan:
        type: object
        properties:
          tool:
            type: string
          findings:
            type: array
            items:
              type: object
              properties:
                severity:
                  type: string
                  enum: [critical, high, medium, low, info]
                description:
                  type: string
                location:
                  type: string
                recommendation:
                  type: string
      dependency_audit:
        type: object
        properties:
          tool:
            type: string
          vulnerabilities_found:
            type: integer
          details:
            type: array
            items:
              type: object
              properties:
                package:
                  type: string
                severity:
                  type: string
                advisory:
                  type: string

  performance_tests:
    type: object
    properties:
      benchmarks:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            metric:
              type: string
            value:
              type: number
            unit:
              type: string
            threshold:
              type: number
            status:
              type: string
              enum: [pass, fail]

  blockers:
    type: array
    items:
      type: object
      required:
        - description
        - severity
      properties:
        description:
          type: string
        severity:
          type: string
          enum: [critical, major, minor]
        affected_requirements:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"
        recommendation:
          type: string

  recommendations:
    type: array
    items:
      type: object
      properties:
        category:
          type: string
          enum: [coverage, reliability, performance, security, maintainability]
        description:
          type: string
        priority:
          type: string
          enum: [high, medium, low]
