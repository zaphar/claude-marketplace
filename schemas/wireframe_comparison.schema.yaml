# JSON Schema for Wireframe Comparison Report (in YAML format)
# This schema validates visual QA comparison output from the QA Engineer personality
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Wireframe Comparison Report
type: object
required:
  - wireframe_comparison
additionalProperties: false

properties:
  wireframe_comparison:
    type: object
    required:
      - metadata
      - summary
      - screens
    additionalProperties: false
    properties:
      metadata:
        type: object
        required:
          - version
          - date
          - author
          - wireframe_source
          - screenshot_source
        additionalProperties: false
        properties:
          version:
            type: string
          date:
            type: string
            format: date
          author:
            type: string
          wireframe_source:
            type: string
          screenshot_source:
            type: string
          commit:
            type: string
          notes:
            type: string

      summary:
        type: object
        required:
          - screens_compared
          - screens_with_discrepancies
          - total_discrepancies
          - critical_discrepancies
          - major_discrepancies
          - minor_discrepancies
          - overall_fidelity
          - assessment
        additionalProperties: false
        properties:
          screens_compared:
            type: integer
            minimum: 0
          screens_with_discrepancies:
            type: integer
            minimum: 0
          total_discrepancies:
            type: integer
            minimum: 0
          critical_discrepancies:
            type: integer
            minimum: 0
          major_discrepancies:
            type: integer
            minimum: 0
          minor_discrepancies:
            type: integer
            minimum: 0
          overall_fidelity:
            type: string
            enum: [high, medium, low, not_assessed]
          assessment:
            type: string

      global_discrepancies:
        type: array
        items:
          $ref: "#/$defs/discrepancy"

      screens:
        type: array
        minItems: 1
        items:
          type: object
          required:
            - screen
            - wireframe_file
            - fidelity
          additionalProperties: false
          properties:
            screen:
              type: string
            wireframe_file:
              type: string
            screenshot_file:
              type:
                - string
                - "null"
            screenshot_note:
              type: string
            fidelity:
              type: string
              enum: [high, medium, low, not_assessed]
            matches:
              type: array
              items:
                type: string
            discrepancies:
              type: array
              items:
                $ref: "#/$defs/discrepancy"
            expected_from_wireframe:
              type: array
              items:
                type: string
            notes:
              type: string

      priority_findings:
        type: object
        additionalProperties: false
        properties:
          critical:
            type: array
            items:
              type: string
          major:
            type: array
            items:
              type: string
          minor:
            type: array
            items:
              type: string

      recommendations:
        type: array
        items:
          type: object
          required:
            - priority
            - description
          additionalProperties: false
          properties:
            priority:
              type: string
              enum: [P1, P2, P3]
            description:
              type: string

$defs:
  discrepancy:
    type: object
    required:
      - id
      - severity
      - category
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[A-Z]+-[0-9]{3}$"
      severity:
        type: string
        enum: [critical, major, minor]
      category:
        type: string
        enum:
          - navigation
          - layout
          - visual
          - functionality
          - branding
          - content
          - naming
          - guidance
          - header
      wireframe:
        type: string
      actual:
        type: string
      impact:
        type: string
