# JSON Schema for Backend Architecture Specification (in YAML format)
# This schema validates the output of the Backend Architect personality
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Backend Architecture Specification
type: object
required:
  - metadata
  - overview
  - technology_choices
  - components
  - requirements_mapping
additionalProperties: false

properties:
  metadata:
    type: object
    required:
      - title
      - version
      - created
      - status
      - requirements_version
    properties:
      title:
        type: string
      version:
        type: string
      created:
        type: string
        format: date
      updated:
        type: string
        format: date
      status:
        type: string
        enum: [draft, review, approved]
      requirements_version:
        type: string
        description: Version of requirements document this architecture addresses
      ux_specification_version:
        type: string
        description: Version of UX specification this coordinates with

  overview:
    type: object
    required:
      - description
      - principles
    properties:
      description:
        type: string
      principles:
        type: array
        items:
          type: string
      diagrams:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            path:
              type: string
            description:
              type: string

  technology_choices:
    type: object
    required:
      - language
      - language_rationale
    properties:
      language:
        type: string
        description: Primary implementation language (must be strongly typed)
      language_rationale:
        type: string
      frameworks:
        type: array
        items:
          type: object
          required:
            - name
            - purpose
          properties:
            name:
              type: string
            purpose:
              type: string
            version:
              type: string
      databases:
        type: array
        items:
          type: object
          required:
            - name
            - purpose
          properties:
            name:
              type: string
            purpose:
              type: string
            type:
              type: string
              enum: [relational, document, key-value, graph, time-series, other]
      message_queues:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            purpose:
              type: string
      caching:
        type: object
        properties:
          strategy:
            type: string
          technology:
            type: string
      external_services:
        type: array
        items:
          type: object
          required:
            - name
            - purpose
          properties:
            name:
              type: string
            purpose:
              type: string
            integration_method:
              type: string

  components:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - name
        - purpose
        - type
      properties:
        id:
          type: string
          pattern: "^COMP-[0-9]{3}$"
        name:
          type: string
        purpose:
          type: string
        type:
          type: string
          enum: [api, service, worker, database, cache, queue, external, library]
        interfaces:
          type: array
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
              type:
                type: string
              description:
                type: string
        dependencies:
          type: array
          items:
            type: string
            pattern: "^COMP-[0-9]{3}$"
        requirements_addressed:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"

  data_model:
    type: array
    items:
      type: object
      required:
        - entity
        - description
      properties:
        entity:
          type: string
        description:
          type: string
        attributes:
          type: array
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
              type:
                type: string
              required:
                type: boolean
              description:
                type: string
        relationships:
          type: array
          items:
            type: object
            properties:
              target:
                type: string
              type:
                type: string
                enum: [one-to-one, one-to-many, many-to-many]
              description:
                type: string

  api_specification:
    type: object
    properties:
      style:
        type: string
        enum: [REST, GraphQL, gRPC, other]
      base_path:
        type: string
      versioning:
        type: object
        properties:
          strategy:
            type: string
            enum: [url-path, header, query-param]
          current_version:
            type: string
      authentication:
        type: object
        properties:
          method:
            type: string
          token_location:
            type: string
      rate_limiting:
        type: object
        properties:
          enabled:
            type: boolean
          strategy:
            type: string
      endpoints:
        type: array
        items:
          type: object
          required:
            - path
            - method
            - description
          properties:
            path:
              type: string
            method:
              type: string
              enum: [GET, POST, PUT, PATCH, DELETE]
            description:
              type: string
            request_schema:
              type: string
            response_schema:
              type: string
            error_responses:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: integer
                  description:
                    type: string
            requirements_addressed:
              type: array
              items:
                type: string
                pattern: "^REQ-[0-9]{3}$"
            ux_flows_supported:
              type: array
              items:
                type: string
                pattern: "^FLOW-[0-9]{3}$"
              description: UX flows this endpoint supports

  requirements_mapping:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - requirement_id
        - addressed_by
      properties:
        requirement_id:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        addressed_by:
          type: array
          items:
            type: string
          description: Component IDs, API endpoints, or other architectural elements
        notes:
          type: string

  deployment_architecture:
    type: object
    properties:
      target:
        type: string
        enum: [private-cloud, local-executable, both]
      environments:
        type: array
        items:
          type: object
          required:
            - name
          properties:
            name:
              type: string
              enum: [development, staging, production]
            infrastructure:
              type: array
              items:
                type: string
      containerization:
        type: object
        properties:
          enabled:
            type: boolean
          runtime:
            type: string
          orchestration:
            type: string
      scaling:
        type: object
        properties:
          strategy:
            type: string
            enum: [horizontal, vertical, none]
          triggers:
            type: array
            items:
              type: string

  observability:
    type: object
    properties:
      logging:
        type: object
        properties:
          format:
            type: string
            enum: [json, structured, plain]
          levels:
            type: array
            items:
              type: string
          aggregation:
            type: string
          retention:
            type: string
      metrics:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            type:
              type: string
              enum: [counter, gauge, histogram, summary]
            description:
              type: string
            labels:
              type: array
              items:
                type: string
      tracing:
        type: object
        properties:
          enabled:
            type: boolean
          provider:
            type: string
          sampling_rate:
            type: number
      health_checks:
        type: array
        items:
          type: object
          properties:
            name:
              type: string
            endpoint:
              type: string
            interval:
              type: string
            timeout:
              type: string

  security_architecture:
    type: object
    properties:
      authentication:
        type: object
        properties:
          method:
            type: string
            enum: [jwt, session, api-key, oauth2, oidc, none]
          provider:
            type: string
          token_expiry:
            type: string
          refresh_strategy:
            type: string
      authorization:
        type: object
        properties:
          model:
            type: string
            enum: [RBAC, ABAC, ACL, none]
          description:
            type: string
          roles:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
      data_protection:
        type: object
        properties:
          encryption_at_rest:
            type: boolean
          encryption_in_transit:
            type: boolean
          pii_handling:
            type: string
          key_management:
            type: string
      secrets_management:
        type: object
        properties:
          provider:
            type: string
          rotation_policy:
            type: string

  decisions:
    type: array
    items:
      type: object
      required:
        - id
        - title
        - decision
        - rationale
      properties:
        id:
          type: string
          pattern: "^ADR-[0-9]{3}$"
        title:
          type: string
        context:
          type: string
        decision:
          type: string
        rationale:
          type: string
        alternatives_considered:
          type: array
          items:
            type: string
        consequences:
          type: array
          items:
            type: string
