# Example Requirements Specification
# Generated by requirements_analyst, approved by requirements_critic

project:
  name: "Task Management API"
  version: "1.0.0"

problem_statement:
  description: "Teams need a simple, secure API for managing tasks across multiple projects"
  target_users:
    - "Software development teams"
    - "Project managers"
    - "Individual contributors"

requirements:
  - id: "REQ-001"
    title: "User Authentication"
    description: "System must authenticate users via JWT tokens"
    priority: "must_have"
    category: "security"
    acceptance_criteria:
      - "Users can register with email and password"
      - "JWT tokens expire after 24 hours"
      - "Refresh tokens supported for seamless renewal"

  - id: "REQ-002"
    title: "Create Tasks"
    description: "Users must be able to create new tasks with title, description, and due date"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Task creation API endpoint available"
      - "Title is required, description optional"
      - "Due date validation ensures future dates only"

  - id: "REQ-003"
    title: "List Tasks"
    description: "Users must be able to retrieve their tasks with filtering and pagination"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Filter by status (pending, completed)"
      - "Pagination with 50 items per page"
      - "Sort by due date or creation date"

  - id: "REQ-004"
    title: "Update Tasks"
    description: "Users must be able to update task details"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Update title, description, due date, or status"
      - "Only task owner can update"
      - "Audit trail of changes maintained"

  - id: "REQ-005"
    title: "Delete Tasks"
    description: "Users must be able to delete tasks"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Soft delete with 30-day recovery period"
      - "Only task owner can delete"
      - "Permanent deletion after 30 days"

  - id: "REQ-006"
    title: "Performance"
    description: "API must respond within 200ms for 95th percentile"
    priority: "should_have"
    category: "performance"
    acceptance_criteria:
      - "Response time < 200ms p95"
      - "Support 1000 concurrent users"
      - "Database queries optimized with indexes"

  - id: "REQ-007"
    title: "Data Encryption"
    description: "All data must be encrypted at rest and in transit"
    priority: "must_have"
    category: "security"
    acceptance_criteria:
      - "HTTPS/TLS 1.3 for all API endpoints"
      - "Database encryption enabled"
      - "Sensitive fields (passwords) hashed with bcrypt"

security_requirements:
  authentication: "JWT-based authentication required"
  authorization: "Role-based access control (RBAC)"
  data_protection: "Encryption at rest and in transit"
  compliance: "GDPR compliant data handling"

deployment_requirements:
  environment: "AWS ECS with Fargate"
  scaling: "Auto-scaling based on CPU utilization"
  monitoring: "CloudWatch metrics and logs"
  backup: "Daily automated backups with 30-day retention"

constraints:
  - "Must use PostgreSQL for data storage"
  - "Budget limited to $500/month for infrastructure"
  - "Must support API versioning for backward compatibility"

assumptions:
  - "Users have modern web browsers or API clients"
  - "Internet connectivity available"
  - "English language only for MVP"

out_of_scope:
  - "Mobile native apps (API-only MVP)"
  - "Team collaboration features"
  - "File attachments to tasks"
  - "Real-time notifications"
