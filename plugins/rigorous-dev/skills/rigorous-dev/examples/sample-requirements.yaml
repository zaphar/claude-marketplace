# Example Requirements Specification
# Generated by requirements_analyst, approved by requirements_critic
# Project: Task Management API

iteration_metadata:
  - key: "problem_statement"
    value: "Teams need a simple, secure API for managing tasks across multiple projects"
  - key: "constraint"
    value: "Must use PostgreSQL for data storage"
  - key: "constraint"
    value: "Budget limited to $500/month for infrastructure"
  - key: "constraint"
    value: "Must support API versioning for backward compatibility"
  - key: "assumption"
    value: "Users have modern web browsers or API clients"
  - key: "assumption"
    value: "Internet connectivity available"
  - key: "assumption"
    value: "English language only for MVP"
  - key: "out_of_scope"
    value: "Mobile native apps (API-only MVP)"
  - key: "out_of_scope"
    value: "Team collaboration features"
  - key: "out_of_scope"
    value: "File attachments to tasks"
  - key: "out_of_scope"
    value: "Real-time notifications"
  - key: "security"
    value: "JWT-based authentication required; Role-based access control (RBAC)"
  - key: "security"
    value: "GDPR compliant data handling"
  - key: "deployment"
    value: "AWS ECS with Fargate; auto-scaling based on CPU utilization"
  - key: "deployment"
    value: "CloudWatch metrics and logs; daily automated backups with 30-day retention"

personas:
  - id: "PERSONA-001"
    name: "Team Lead"
    description: "Manages a team of 5-10 developers, needs task oversight and prioritization tools"
    technical_level: "intermediate"
    frequency_of_use: "daily"
    goals:
      - "Track team progress across multiple projects"
      - "Prioritize and assign tasks efficiently"
      - "Audit changes made by team members"

  - id: "PERSONA-002"
    name: "Individual Contributor"
    description: "Software developer who needs to manage their own tasks and track progress"
    technical_level: "advanced"
    frequency_of_use: "daily"
    goals:
      - "Quickly create and update tasks"
      - "Filter tasks by status and priority"
      - "Integrate task API with their own tooling"

  - id: "PERSONA-003"
    name: "Project Manager"
    description: "Non-technical stakeholder who monitors delivery timelines and overall project health"
    technical_level: "beginner"
    frequency_of_use: "weekly"
    goals:
      - "View high-level task status across projects"
      - "Ensure deadlines are visible and tracked"

requirements:
  - id: "REQ-001"
    title: "User Authentication"
    description: "System must authenticate users via JWT tokens"
    priority: "must_have"
    category: "security"
    acceptance_criteria:
      - "Users can register with email and password"
      - "JWT tokens expire after 24 hours"
      - "Refresh tokens supported for seamless renewal"
    personas: ["PERSONA-001", "PERSONA-002", "PERSONA-003"]

  - id: "REQ-002"
    title: "Create Tasks"
    description: "Users must be able to create new tasks with title, description, and due date"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Task creation API endpoint available"
      - "Title is required, description optional"
      - "Due date validation ensures future dates only"
    personas: ["PERSONA-001", "PERSONA-002"]

  - id: "REQ-003"
    title: "List Tasks"
    description: "Users must be able to retrieve their tasks with filtering and pagination"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Filter by status (pending, completed)"
      - "Pagination with 50 items per page"
      - "Sort by due date or creation date"
    personas: ["PERSONA-001", "PERSONA-002", "PERSONA-003"]

  - id: "REQ-004"
    title: "Update Tasks"
    description: "Users must be able to update task details"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Update title, description, due date, or status"
      - "Only task owner can update"
      - "Audit trail of changes maintained"
    personas: ["PERSONA-001", "PERSONA-002"]

  - id: "REQ-005"
    title: "Delete Tasks"
    description: "Users must be able to delete tasks"
    priority: "must_have"
    category: "functional"
    acceptance_criteria:
      - "Soft delete with 30-day recovery period"
      - "Only task owner can delete"
      - "Permanent deletion after 30 days"
    personas: ["PERSONA-002"]
    dependencies: ["REQ-002"]

  - id: "REQ-006"
    title: "Performance"
    description: "API must respond within 200ms for 95th percentile"
    priority: "should_have"
    category: "performance"
    acceptance_criteria:
      - "Response time < 200ms p95"
      - "Support 1000 concurrent users"
      - "Database queries optimized with indexes"
    personas: ["PERSONA-001", "PERSONA-002", "PERSONA-003"]

  - id: "REQ-007"
    title: "Data Encryption"
    description: "All data must be encrypted at rest and in transit"
    priority: "must_have"
    category: "security"
    acceptance_criteria:
      - "HTTPS/TLS 1.3 for all API endpoints"
      - "Database encryption enabled"
      - "Sensitive fields (passwords) hashed with bcrypt"
    personas: ["PERSONA-001", "PERSONA-002", "PERSONA-003"]
