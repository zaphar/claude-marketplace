# JSON Schema for Architecture Data Model (in YAML format)
# Data model entities and relationships
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Data Model
type: object
required:
  - entities
additionalProperties: false

properties:
  entities:
    type: array
    items:
      type: object
      required:
        - entity
        - description
      properties:
        entity:
          type: string
        description:
          type: string
        attributes:
          type: array
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
              type:
                type: string
              required:
                type: boolean
              description:
                type: string
        relationships:
          type: array
          items:
            type: object
            properties:
              target:
                type: string
              type:
                type: string
                enum: [one-to-one, one-to-many, many-to-many]
              description:
                type: string
