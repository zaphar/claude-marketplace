# JSON Schema for Architecture Components (in YAML format)
# Component definitions, interfaces, and integration test boundaries
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Components
type: object
required:
  - components
additionalProperties: false

properties:
  components:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - name
        - purpose
        - type
      properties:
        id:
          type: string
          pattern: "^COMP-[0-9]{3}$"
        name:
          type: string
        purpose:
          type: string
        type:
          type: string
          enum: [api, service, worker, database, cache, queue, external, library]
        interfaces:
          type: array
          items:
            type: object
            required:
              - name
              - type
            properties:
              name:
                type: string
              type:
                type: string
              description:
                type: string
        dependencies:
          type: array
          items:
            type: string
            pattern: "^COMP-[0-9]{3}$"
        requirements_addressed:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"
        integration_test_boundaries:
          type: array
          description: Inter-component interactions that require integration testing
          items:
            type: object
            required:
              - target_component
              - boundary_type
              - correct_behavior
            properties:
              target_component:
                type: string
                pattern: "^COMP-[0-9]{3}$"
              boundary_type:
                type: string
                enum: [api_call, database_access, message_event, file_system]
              correct_behavior:
                type: string
                description: What constitutes correct behavior at this boundary
