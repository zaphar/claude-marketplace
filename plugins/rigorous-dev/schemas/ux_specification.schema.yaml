# JSON Schema for UX Specification (in YAML format)
# This schema validates the output of the UX Designer personality
$schema: "https://json-schema.org/draft/2020-12/schema"
title: UX Specification
type: object
required:
  - metadata
  - personas_addressed
  - user_flows
  - design_system
  - requirements_mapping
additionalProperties: false

properties:
  personas:
    type: array
    description: User persona definitions describing the primary users of the system
    items:
      type: object
      required:
        - id
        - name
        - description
        - goals
      properties:
        id:
          type: string
          pattern: "^PERSONA-[0-9]{3}$"
        name:
          type: string
        description:
          type: string
        goals:
          type: array
          items:
            type: string
        technical_level:
          type: string
        frequency_of_use:
          type: string

  metadata:
    type: object
    required:
      - title
      - version
      - created
      - status
      - requirements_version
    properties:
      title:
        type: string
      version:
        type: string
      created:
        type: string
        format: date
      updated:
        type: string
        format: date
      status:
        type: string
        enum: [draft, review, approved]
      requirements_version:
        type: string
        description: Version of requirements document this addresses
      design_tool:
        type: string
        description: Tool used for designs (Figma, Sketch, etc.)
      design_file_link:
        type: string
        description: Link to design files if hosted externally

  personas_addressed:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - persona_id
        - goals_addressed
      properties:
        persona_id:
          type: string
          pattern: "^PERSONA-[0-9]{3}$"
        goals_addressed:
          type: array
          items:
            type: object
            properties:
              goal:
                type: string
              how_addressed:
                type: string
              flows:
                type: array
                items:
                  type: string
                  pattern: "^FLOW-[0-9]{3}$"

  information_architecture:
    type: object
    properties:
      site_map:
        type: array
        items:
          type: object
          required:
            - name
            - path
          properties:
            name:
              type: string
            path:
              type: string
            children:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  path:
                    type: string
      navigation:
        type: object
        properties:
          primary:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                destination:
                  type: string
                icon:
                  type: string
          secondary:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                destination:
                  type: string
      terminology:
        type: array
        items:
          type: object
          properties:
            term:
              type: string
            definition:
              type: string
            usage_context:
              type: string
        description: Domain terms in user language

  user_flows:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - name
        - goal
        - steps
      properties:
        id:
          type: string
          pattern: "^FLOW-[0-9]{3}$"
        name:
          type: string
        goal:
          type: string
        persona:
          type: string
          pattern: "^PERSONA-[0-9]{3}$"
        entry_point:
          type: string
        steps:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - step_number
              - action
              - screen
            properties:
              step_number:
                type: integer
              action:
                type: string
              screen:
                type: string
              decision_point:
                type: boolean
              branches:
                type: array
                items:
                  type: object
                  properties:
                    condition:
                      type: string
                    next_step:
                      type: integer
        success_state:
          type: string
        error_states:
          type: array
          items:
            type: object
            properties:
              condition:
                type: string
              recovery:
                type: string
        requirements_addressed:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"
        data_dependencies:
          type: array
          items:
            type: string
          description: Data that this flow needs to read or write, described without implying API design

  screens:
    type: array
    items:
      type: object
      required:
        - id
        - name
        - purpose
      properties:
        id:
          type: string
          pattern: "^SCREEN-[0-9]{3}$"
        name:
          type: string
        purpose:
          type: string
        wireframe_path:
          type: string
        mockup_path:
          type: string
        components:
          type: array
          items:
            type: string
        states:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                enum: [default, loading, empty, error, success, session_expired, forced, editing, reviewing, search_results, complete]
              description:
                type: string
              wireframe_path:
                type: string
        responsive_variants:
          type: array
          items:
            type: object
            properties:
              breakpoint:
                type: string
              wireframe_path:
                type: string
              layout_changes:
                type: string

  design_system:
    type: object
    required:
      - colors
      - typography
    properties:
      colors:
        type: object
        properties:
          primary:
            type: string
          secondary:
            type: string
          accent:
            type: string
          background:
            type: string
          surface:
            type: string
          error:
            type: string
          warning:
            type: string
          success:
            type: string
          info:
            type: string
          text:
            type: object
            properties:
              primary:
                type: string
              secondary:
                type: string
              disabled:
                type: string
      typography:
        type: object
        properties:
          font_family:
            type: object
            properties:
              primary:
                type: string
              monospace:
                type: string
          scale:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                size:
                  type: string
                weight:
                  type: string
                line_height:
                  type: string
                usage:
                  type: string
      spacing:
        type: object
        properties:
          unit:
            type: string
          scale:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                value:
                  type: string
      component_library:
        type: object
        properties:
          name:
            type: string
          version:
            type: string
          customizations:
            type: array
            items:
              type: string
      icons:
        type: object
        properties:
          library:
            type: string
          custom_icons:
            type: array
            items:
              type: object
              properties:
                name:
                  type: string
                path:
                  type: string
                usage:
                  type: string
      branding:
        type: object
        properties:
          logo_path:
            type: string
          logo_variants:
            type: array
            items:
              type: object
              properties:
                variant:
                  type: string
                path:
                  type: string
          brand_guidelines_path:
            type: string

  accessibility:
    type: object
    required:
      - wcag_level
    properties:
      wcag_level:
        type: string
        enum: [A, AA, AAA]
      color_contrast:
        type: object
        properties:
          normal_text_ratio:
            type: string
          large_text_ratio:
            type: string
          ui_components_ratio:
            type: string
      keyboard_navigation:
        type: object
        properties:
          focus_indicator:
            type: string
          tab_order_documented:
            type: boolean
          skip_links:
            type: boolean
          keyboard_shortcuts:
            type: array
            items:
              type: object
              properties:
                key:
                  type: string
                action:
                  type: string
      screen_reader:
        type: object
        properties:
          aria_landmarks:
            type: boolean
          live_regions:
            type: array
            items:
              type: string
          alt_text_requirements:
            type: string
      motion:
        type: object
        properties:
          reduced_motion_support:
            type: boolean
          animation_duration_max:
            type: string

  responsive:
    type: object
    properties:
      breakpoints:
        type: array
        items:
          type: object
          required:
            - name
            - min_width
          properties:
            name:
              type: string
            min_width:
              type: integer
            max_width:
              type: integer
            columns:
              type: integer
            gutter:
              type: string
      touch_targets:
        type: object
        properties:
          minimum_size:
            type: string
          spacing:
            type: string

  feedback_patterns:
    type: object
    properties:
      loading:
        type: object
        properties:
          indicator_type:
            type: string
          skeleton_screens:
            type: boolean
          timeout_handling:
            type: string
      validation:
        type: object
        properties:
          timing:
            type: string
            enum: [on-blur, on-change, on-submit]
          error_display:
            type: string
          success_display:
            type: string
      notifications:
        type: object
        properties:
          position:
            type: string
          duration:
            type: string
          types:
            type: array
            items:
              type: string
              enum: [success, error, warning, info]
      confirmations:
        type: object
        properties:
          destructive_actions:
            type: string
          success_feedback:
            type: string

  requirements_mapping:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - requirement_id
        - addressed_by
      properties:
        requirement_id:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        addressed_by:
          type: array
          items:
            type: string
          description: Flow IDs, Screen IDs, or other UX elements
        notes:
          type: string

  assets:
    type: array
    items:
      type: object
      required:
        - name
        - path
        - type
      properties:
        name:
          type: string
        path:
          type: string
        type:
          type: string
          enum: [wireframe, mockup, prototype, icon, image, video]
        screen:
          type: string
          pattern: "^SCREEN-[0-9]{3}$"
        description:
          type: string
