# JSON Schema for Documentation Manifest (in YAML format)
# This schema validates the output of the Documentation Master personality
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Documentation Manifest
type: object
required:
  - metadata
  - summary
  - user_documentation
  - requirements_coverage
additionalProperties: false

properties:
  metadata:
    type: object
    required:
      - version
      - created
      - requirements_version
      - implementation_version
    properties:
      version:
        type: string
      created:
        type: string
        format: date-time
      requirements_version:
        type: string
      architecture_version:
        type: string
      implementation_version:
        type: string
      format:
        type: string
        enum: [markdown, html, pdf, docusaurus, mkdocs, other]

  summary:
    type: object
    required:
      - status
      - documents_created
    properties:
      status:
        type: string
        enum: [complete, partial, blocked]
      documents_created:
        type: integer
        minimum: 0
      total_pages:
        type: integer
      accessibility_compliant:
        type: boolean

  user_documentation:
    type: object
    required:
      - getting_started
      - features
    properties:
      getting_started:
        type: object
        required:
          - path
          - sections
        properties:
          path:
            type: string
          sections:
            type: array
            items:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type: string
      installation:
        type: object
        properties:
          path:
            type: string
          platforms_covered:
            type: array
            items:
              type: string
      features:
        type: array
        items:
          type: object
          required:
            - name
            - path
            - requirements_documented
          properties:
            name:
              type: string
            path:
              type: string
            requirements_documented:
              type: array
              items:
                type: string
                pattern: "^REQ-[0-9]{3}$"
            includes_examples:
              type: boolean
            includes_screenshots:
              type: boolean
      configuration:
        type: object
        properties:
          path:
            type: string
          options_documented:
            type: integer
      troubleshooting:
        type: object
        properties:
          path:
            type: string
          common_issues_covered:
            type: integer
      faq:
        type: object
        properties:
          path:
            type: string
          questions_answered:
            type: integer

  api_documentation:
    type: object
    properties:
      path:
        type: string
      format:
        type: string
        enum: [openapi, asyncapi, graphql-schema, custom]
      endpoints_documented:
        type: integer
      includes_examples:
        type: boolean
      generated_from_code:
        type: boolean

  operator_documentation:
    type: object
    properties:
      deployment_guide:
        type: object
        properties:
          path:
            type: string
          environments_covered:
            type: array
            items:
              type: string
      runbooks:
        type: object
        properties:
          path:
            type: string
          scenarios_covered:
            type: array
            items:
              type: string
      monitoring_guide:
        type: object
        properties:
          path:
            type: string
          metrics_documented:
            type: integer
          alerts_documented:
            type: integer

  developer_documentation:
    type: object
    properties:
      architecture_overview:
        type: object
        properties:
          path:
            type: string
      contributing_guide:
        type: object
        properties:
          path:
            type: string
      adr_index:
        type: object
        properties:
          path:
            type: string
          decisions_documented:
            type: integer

  requirements_coverage:
    type: array
    items:
      type: object
      required:
        - requirement_id
        - documented
      properties:
        requirement_id:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        documented:
          type: boolean
        documentation_paths:
          type: array
          items:
            type: string
        user_facing:
          type: boolean
        notes:
          type: string

  assets:
    type: array
    items:
      type: object
      required:
        - path
        - type
      properties:
        path:
          type: string
        type:
          type: string
          enum: [screenshot, diagram, video, code-sample, other]
        description:
          type: string
        alt_text:
          type: string
          description: Required for accessibility

  verification:
    type: object
    properties:
      spell_checked:
        type: boolean
      links_validated:
        type: boolean
      code_samples_tested:
        type: boolean
      screenshots_current:
        type: boolean
      no_hallucinated_features:
        type: boolean

  review_checklist:
    type: object
    properties:
      all_user_facing_requirements_documented:
        type: boolean
      installation_instructions_tested:
        type: boolean
      all_features_documented:
        type: boolean
      examples_are_runnable:
        type: boolean
      accessibility_standards_met:
        type: boolean
      no_broken_links:
        type: boolean
      versioned_with_release:
        type: boolean
