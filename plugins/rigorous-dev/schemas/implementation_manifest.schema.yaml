# JSON Schema for Implementation Manifest (in YAML format)
# This schema validates the output of the Senior Developer personality
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Implementation Manifest
type: object
required:
  - metadata
  - summary
  - requirements_implementation
  - components_implemented
additionalProperties: false

properties:
  metadata:
    type: object
    required:
      - version
      - created
      - requirements_version
      - architecture_version
    properties:
      version:
        type: string
      created:
        type: string
        format: date-time
      requirements_version:
        type: string
      architecture_version:
        type: string
      language:
        type: string
      commit_sha:
        type: string

  summary:
    type: object
    required:
      - status
      - files_created
      - files_modified
    properties:
      status:
        type: string
        enum: [complete, partial, blocked]
      files_created:
        type: integer
        minimum: 0
      files_modified:
        type: integer
        minimum: 0
      lines_of_code:
        type: integer
      warnings:
        type: integer
        minimum: 0
        description: Must be 0 for handoff
      build_status:
        type: string
        enum: [success, failure]

  requirements_implementation:
    type: array
    items:
      type: object
      required:
        - requirement_id
        - status
      properties:
        requirement_id:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        status:
          type: string
          enum: [implemented, partial, not_started, blocked, not_applicable]
        implemented_in:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
              function:
                type: string
              line_range:
                type: string
        notes:
          type: string
        blockers:
          type: array
          items:
            type: string

  components_implemented:
    type: array
    items:
      type: object
      required:
        - component_id
        - status
      properties:
        component_id:
          type: string
          pattern: "^COMP-[0-9]{3}$"
        status:
          type: string
          enum: [complete, partial, not_started]
        files:
          type: array
          items:
            type: string
        interfaces_implemented:
          type: array
          items:
            type: string
        notes:
          type: string

  files:
    type: array
    items:
      type: object
      required:
        - path
        - action
      properties:
        path:
          type: string
        action:
          type: string
          enum: [created, modified, deleted]
        purpose:
          type: string
        requirements_addressed:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"
        component:
          type: string
          pattern: "^COMP-[0-9]{3}$"

  dependencies_added:
    type: array
    items:
      type: object
      required:
        - name
        - version
        - purpose
      properties:
        name:
          type: string
        version:
          type: string
        purpose:
          type: string
        license:
          type: string

  api_endpoints_implemented:
    type: array
    items:
      type: object
      required:
        - path
        - method
        - status
      properties:
        path:
          type: string
        method:
          type: string
        status:
          type: string
          enum: [complete, stubbed, not_started]
        requirements_addressed:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"

  database_migrations:
    type: array
    items:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [created, applied, pending]

  blockers:
    type: array
    items:
      type: object
      required:
        - description
        - severity
      properties:
        description:
          type: string
        severity:
          type: string
          enum: [critical, major, minor]
        affected_requirements:
          type: array
          items:
            type: string
            pattern: "^REQ-[0-9]{3}$"
        recommendation:
          type: string
        needs_escalation:
          type: boolean

  review_checklist:
    type: object
    properties:
      zero_warnings:
        type: boolean
      no_duplicated_code:
        type: boolean
      security_review_passed:
        type: boolean
      performance_considerations_addressed:
        type: boolean
      modularity_standards_met:
        type: boolean
      all_requirements_addressed:
        type: boolean
