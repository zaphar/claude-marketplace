# JSON Schema for Architecture Observability (in YAML format)
# Logging, metrics, tracing, health checks
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Observability
type: object
additionalProperties: false

properties:
  logging:
    type: object
    properties:
      format:
        type: string
        enum: [json, structured, plain]
      levels:
        type: array
        items:
          type: string
      aggregation:
        type: string
      retention:
        type: string
  metrics:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [counter, gauge, histogram, summary]
        description:
          type: string
        labels:
          type: array
          items:
            type: string
  tracing:
    type: object
    properties:
      enabled:
        type: boolean
      provider:
        type: string
      sampling_rate:
        type: number
  health_checks:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        endpoint:
          type: string
        interval:
          type: string
        timeout:
          type: string
