# JSON Schema for Architecture Traceability (in YAML format)
# Requirements-to-architecture mapping
$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Traceability
type: object
required:
  - requirements_mapping
additionalProperties: false

properties:
  requirements_mapping:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - requirement_id
        - addressed_by
      properties:
        requirement_id:
          type: string
          pattern: "^REQ-[0-9]{3}$"
        addressed_by:
          type: array
          items:
            type: string
          description: Component IDs, API endpoints, or other architectural elements
        notes:
          type: string
